services:
  postgres:
    image: postgres:16-alpine
    container_name: auth_platform_db
    environment:
      POSTGRES_DB: auth_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - auth_platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  auth_platform_postgres_data:
